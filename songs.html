<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Music</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2c2c54);
    color: #fff;
}
header {
    padding: 20px;
    text-align: center;
    background: #111;
    position: sticky;
    top: 0;
    z-index: 10;
}
header h1 {
    margin: 0;
    font-size: 24px;
}
#search {
    width: 80%;
    padding: 10px;
    border-radius: 25px;
    border: none;
    margin-top: 10px;
}
#songList {
    margin: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.song {
    background: rgba(255,255,255,0.05);
    padding: 12px 15px;
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.song span {
    font-size: 16px;
    font-weight: 500;
}
.song button {
    background: #00d1b2;
    border: none;
    border-radius: 8px;
    padding: 6px 10px;
    margin-left: 6px;
    cursor: pointer;
    transition: 0.2s;
}
.song button:hover {
    background: #00b89c;
}
#audioPlayerContainer {
    display: none;
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #222;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
}
#audioPlayerContainer audio {
    flex: 1;
    margin-right: 15px;
}
footer {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #111;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
}
footer div {
    cursor: pointer;
    color: #fff;
}
footer div:hover {
    color: #00cec9;
}
</style>
</head>
<body>

<header>
    <h1>🎧 Halal Music</h1>
    <input type="text" id="search" placeholder="Search songs...">
</header>

<main id="songList">
    <p>Loading songs...</p>
</main>

<!-- Audio Player -->
<div id="audioPlayerContainer">
    <audio id="player" controls></audio>
    <span id="currentSong">🎵 Song Name</span>
</div>

<footer>
    <div onclick="alert('Downloads coming soon')">⬇ Downloads</div>
    <div onclick="alert('Prayer coming soon')">🕌 Prayer</div>
</footer>

<script>
// Elements
const songListDiv = document.getElementById("songList");
const player = document.getElementById("player");
const playerContainer = document.getElementById("audioPlayerContainer");
const currentSongSpan = document.getElementById("currentSong");

let songs = [];
let currentIndex = 0;

// Fetch songs.json from backend
fetch('https://halal-music-backend.onrender.com/songs.json')
.then(res=>res.json())
.then(data=>{
    songs = data;
    renderSongList();
})
.catch(err=>{
    songListDiv.innerHTML = "<p>⚠️ Failed to load songs!</p>";
    console.error(err);
});

// Render songs
function renderSongList(){
    songListDiv.innerHTML = '';
    songs.forEach((song, index)=>{
        const div = document.createElement('div');
        div.className = 'song';
        div.innerHTML = `
            <span>🎵 ${song.title}</span>
            <div>
                <button onclick="playSong(${index})">▶</button>
                <button onclick="downloadSong('${song.url}')">⬇</button>
            </div>
        `;
        songListDiv.appendChild(div);
    });
}

// Play song
function playSong(index){
    currentIndex = index;
    const url = `https://halal-music-backend.onrender.com${encodeURIComponent(songs[index].url)}`;
    player.src = url;
    currentSongSpan.textContent = `🎵 ${songs[index].title}`;
    playerContainer.style.display = 'flex';
    player.play().catch(err=>console.error(err));
}

// Hide audio on end
player.onended = function(){
    playerContainer.style.display = 'none';
}

// Download
function downloadSong(url){
    const a = document.createElement('a');
    a.href = `https://halal-music-backend.onrender.com${encodeURIComponent(url)}`;
    a.download = url.split('/').pop();
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// Search
document.getElementById("search").addEventListener("keyup", function(e){
    const filter = e.target.value.toLowerCase();
    const songsDivs = document.querySelectorAll(".song");
    songsDivs.forEach(div=>{
        const text = div.querySelector("span").textContent.toLowerCase();
        div.style.display = text.includes(filter) ? "flex" : "none";
    });
});
</script>

</body>
  </html>
