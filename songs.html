<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Music - Songs</title>
<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #1e1e2f, #2c2c54);
  color: white;
}
header {
  text-align: center;
  padding: 15px;
  background: #111;
  position: sticky;
  top: 0;
}
header h1 {
  margin: 0;
  font-size: 22px;
  font-weight: bold;
}
#search {
  width: 80%;
  padding: 8px 12px;
  border-radius: 25px;
  border: none;
  outline: none;
  margin-top: 10px;
}
#songList {
  margin: 15px;
}
.song {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(255,255,255,0.08);
  border-radius: 10px;
  margin: 10px 0;
  padding: 10px 15px;
  flex-wrap: wrap;
}
.song h4 {
  margin: 0;
  font-size: 14px;
  flex: 1;
}
button {
  background: #00d1b2;
  border: none;
  border-radius: 8px;
  padding: 6px 10px;
  margin-left: 5px;
  cursor: pointer;
  font-size: 12px;
  transition: 0.2s;
}
button:hover {
  background: #00b89c;
}
audio {
  width: 100%;
  position: fixed;
  bottom: 70px;
}
footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #222;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  font-size: 16px;
}
footer div {
  cursor: pointer;
}
footer div:hover {
  color: #00cec9;
}
</style>
</head>
<body>

<header>
  <h1>🎧 Halal Music</h1>
  <input type="text" id="search" placeholder="Search songs...">
</header>

<main id="songList">
  <p>Loading songs...</p>
</main>

<audio id="player" controls></audio>

<footer>
  <div onclick="alert('Downloads page coming soon')">⬇ Downloads</div>
  <div onclick="alert('Prayer page coming soon')">🕌 Prayer</div>
</footer>

<script>
// 🎯 Song API (JSON file hosted online)
const songAPI = "https://raw.githubusercontent.com/public-apis-playground/music-demo/main/songs.json";

const songList = document.getElementById("songList");

async function loadSongs() {
  try {
    const res = await fetch(songAPI);
    const songs = await res.json();

    songList.innerHTML = songs.map(song => `
      <div class="song">
        <h4>${song.title}</h4>
        <button onclick="playSong('${song.url}')">▶</button>
        <button onclick="downloadSong('${song.url}')">⬇</button>
      </div>
    `).join('');
  } catch (err) {
    songList.innerHTML = "<p>⚠️ Failed to load songs!</p>";
    console.error(err);
  }
}

function playSong(src) {
  const player = document.getElementById("player");
  player.src = src;
  player.play();
}

function downloadSong(src) {
  const a = document.createElement('a');
  a.href = src;
  a.download = src.split('/').pop();
  a.click();
  alert('✅ Added to downloads!');
}

// 🔍 Search functionality
document.getElementById("search").addEventListener("keyup", function(e){
  const filter = e.target.value.toLowerCase();
  const songs = document.querySelectorAll(".song");
  songs.forEach(song => {
    const text = song.querySelector("h4").textContent.toLowerCase();
    song.style.display = text.includes(filter) ? "flex" : "none";
  });
});

loadSongs();
</script>

</body>
</html>
