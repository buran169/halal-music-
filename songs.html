<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halal Music</title>
<style>
body{font-family:Arial;background:#1e1e2f;color:white;margin:0;padding:0;}
header{text-align:center;padding:10px;background:#111;}
#search{width:80%;padding:5px;border-radius:20px;border:none;margin-top:5px;}
.song{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,0.1);margin:5px;padding:5px;border-radius:8px;}
button{margin-left:5px;padding:5px 8px;border:none;border-radius:5px;cursor:pointer;background:#00d1b2;color:white;}
audio{width:100%;position:fixed;bottom:50px;}
</style>
</head>
<body>
<header>
<h1>🎧 Halal Music</h1>
<input type="text" id="🔎 search 🔍" placeholder="Search songs...">
</header>

<main id="songList"><p>Loading songs...</p></main>
<audio id="player" controls></audio>

<script>
const songList = document.getElementById("songList");
const player = document.getElementById("player");

// Replace with your Render live link if deployed
const SONG_API = "/songs"; // local or Render: "https://halal-music-backend.onrender.com/songs"

async function loadSongs(){
  try{
    const res = await fetch(SONG_API);
    const songs = await res.json();
    if(songs.length===0){
      songList.innerHTML="<p>No songs uploaded yet</p>";
      return;
    }
    songList.innerHTML = songs.map(song=>`
      <div class="song">
        <span>🎵 ${song.title}</span>
        <div>
          <button onclick="playSong('${song.url}')">▶</button>
          <button onclick="downloadSong('${song.url}')">⬇</button>
        </div>
      </div>
    `).join('');
  }catch(err){
    songList.innerHTML="<p>Error loading songs</p>";
    console.error(err);
  }
}

function playSong(url){player.src=url;player.play();}
function downloadSong(url){const a=document.createElement('a');a.href=url;a.download=url.split('/').pop();a.click();}

// Search/filter
document.getElementById('search').addEventListener('input',e=>{
  const filter=e.target.value.toLowerCase();
  document.querySelectorAll('.song').forEach(song=>{
    const text=song.querySelector('span').textContent.toLowerCase();
    song.style.display = text.includes(filter) ? 'flex':'none';
  });
});

loadSongs();
</script>
</body>
</html>
